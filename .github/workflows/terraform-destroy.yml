name: terraform-destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: ''

# SEC-004-A3: see terraform-apply.yml. Destroy needs no repository write scope
# either.
permissions:
  contents: read

# CHORE-003-A1/A4. The same group as terraform-apply, so a destroy cannot start
# while an apply is running and vice versa. Both write the same state file, and
# an interleaved pair can leave state describing neither outcome.
concurrency:
  group: terraform-lab-state
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: [self-hosted, gha-runner-01]
    environment: prod
    steps:
      # First step in the job: an unconfirmed dispatch must do no work at all -
      # no checkout, no provider download, no state directory check, no `init`.
      #
      # The input reaches bash through `env:`, not through `${{ }}` inside the
      # script body. Actions expands `${{ }}` into the script text before bash
      # parses it, so a crafted `confirm` value closes the quoted comparison and
      # runs as code on the self-hosted runner. Read as an environment variable
      # it is data, and bash never parses it as source. (SEC-005)
      - name: Confirm destroy
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "::error::Destroy not confirmed. Re-run workflow and type DESTROY in the confirm field."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          # BUG-023. The shim gives the real binary no stdin and nothing here
          # reads its outputs - see terraform-apply.yml for the whole story.
          terraform_wrapper: false

      # BUG-003. The destroy step below used to omit TF_VAR_windows_admin_password
      # entirely while `terraform init` set it, so `terraform destroy` evaluated
      # the configuration with a different Windows password than the apply that
      # built it. It now takes the same variables from the same place as the
      # other two workflows.
      - uses: ./.github/actions/terraform-env
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}

      # SEC-004-A4: no workflow step invokes sudo. The runner account had
      # passwordless sudo purely to create this directory, which handed every
      # step on the box a root escalation for the sake of one mkdir. The
      # directory is now created once during runner provisioning - see
      # docs/runner-trust-boundary.md - and this step only asserts it is there.
      - name: Verify Terraform state directory
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR=/opt/terraform-state/proxmox-ubuntu-vm-factory
          if [ ! -d "$STATE_DIR" ]; then
            echo "::error::$STATE_DIR does not exist. Create it during runner provisioning, owned by the runner account. See docs/runner-trust-boundary.md."
            exit 1
          fi
          if [ ! -w "$STATE_DIR" ]; then
            echo "::error::$STATE_DIR is not writable by $(id -un). Fix ownership during runner provisioning. See docs/runner-trust-boundary.md."
            exit 1
          fi
          echo "State directory present and writable."

      - run: terraform init -reconfigure

      # FEAT-001-A3. docs/state-recovery.md documents a restore and proves it
      # works in a drill; its own section 5 then lists "somewhere to restore
      # *from*" as missing. This is that.
      #
      # Placed immediately after init, before anything else touches the
      # backend. `terraform plan` is not supposed to persist a refreshed state
      # in a modern Terraform, but the backup costs one file copy and putting
      # it here removes the need to be right about that.
      #
      # It does not make losing the runner's disk survivable - the copy is on
      # that disk. FEAT-001-A1's remote-backend decision is still open, and it
      # cannot be closed by adding an upload step here: state holds cleartext
      # credentials for its whole history, so an unencrypted copy anywhere off
      # the runner is SEC-002 with a different filename.
      - name: Back up Terraform state
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR=/opt/terraform-state/proxmox-ubuntu-vm-factory
          python3 .github/scripts/backup_state.py \
            --state-file "$STATE_DIR/terraform.tfstate" \
            --backup-dir "$STATE_DIR/backups" \
            --keep 20 \
            --label "$GITHUB_RUN_ID"

      # BUG-024. Proxmox keeps every VM configuration in /etc/pve, which is
      # pmxcfs: a filesystem corosync replicates between nodes and mounts
      # read-only in any partition that is not quorate. Cloning a VM writes
      # /etc/pve/nodes/<node>/qemu-server/<vmid>.conf, so an inquorate cluster
      # rejects the clone whichever node the VM was destined for.
      #
      # Terraform cannot see that coming. Run 33074685788 planned three
      # resources, created the two that do not touch /etc/pve - the Arc marker
      # and the user-data snippet - and failed the third with a provider-level
      # `HTTP 500 - cluster not ready - no quorum?`. The state left behind is
      # consistent but incomplete, and the log says nothing about which node
      # was missing or what to do about it.
      #
      # This does not make an apply survive a node dying halfway through;
      # nothing here can. It removes the case where the cluster was already
      # unwritable before the run started, which is the case that happened,
      # and it costs one GET.
      - name: Preflight (the cluster can accept writes)
        shell: bash
        run: |
          set -euo pipefail

          # var.proxmox_endpoint has a default and is not a secret, so it is not
          # in the TF_VAR set that terraform-env renders. Reading it back from
          # the configuration keeps one definition rather than repeating the
          # address here. -input=false and a timeout for the same reasons as the
          # inventory guard below: a console that blocks should fail the step,
          # not hold the terraform-lab-state group.
          rc=0
          timeout 60 terraform console -no-color -input=false <<<'var.proxmox_endpoint' > endpoint.txt 2> endpoint-err.txt || rc=$?
          cat endpoint-err.txt >&2 || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not read var.proxmox_endpoint (terraform console exited $rc)."
            exit 1
          fi

          python3 .github/scripts/preflight_cluster.py --endpoint-file endpoint.txt
      - name: Show Terraform state (debug)
        shell: bash
        run: |
          set +e
          terraform state list 2>/dev/null
          echo "(terraform state list exit code=$?)"
          exit 0

      # BUG-004. README.md has always described destroying the lab as
      # "1. Reads Terraform state 2. Detects Arc-enabled machines 3. Deletes
      # Azure Arc resources 4. Removes VMs from Proxmox", concluding "No orphan
      # Azure Arc resources". This workflow did none of steps 1-3 - it confirmed
      # the input and called `terraform destroy`. Every destroy therefore left
      # stale Microsoft.HybridCompute/machines behind, which then block
      # re-onboarding under the same name.
      #
      # extract_arc_names_from_state.py existed precisely to serve this flow and
      # was referenced by nothing.
      #
      # BUG-004-A3: state JSON is secret-bearing, for a different reason than
      # plan JSON. It carries no `variables` block, but it does hold
      # source_raw.data for every proxmox_virtual_environment_file.user_data -
      # the fully rendered cloud-init snippet, Arc secret and admin passwords
      # included. So the exposure scales with the number of managed VMs rather
      # than being unconditional, and unlike the plan-file leak this one is
      # closed by SEC-001 (#46). Until then: consumed here, deleted immediately,
      # never uploaded, and removed again in an always() step below so a
      # cancelled run leaves nothing behind.
      - name: Collect Arc machine names from state
        shell: bash
        run: |
          set -euo pipefail
          : > arc_delete_names.txt

          if [ -z "${TF_VAR_arc_sp_id:-}" ]; then
            echo "No Arc credentials configured; not reading state."
            exit 0
          fi

          terraform show -json > state.json
          python3 .github/scripts/extract_arc_names_from_state.py state.json > arc_delete_names.txt
          rm -f state.json

      # Before the destroy, not after: once the VM is gone its Arc resource is
      # unreachable from state and can only be found by hand. And because a
      # failed delete fails this step, a destroy that cannot clean up Azure does
      # not proceed - nothing is destroyed and nothing is orphaned. See
      # docs/arc-cleanup.md.
      - uses: ./.github/actions/arc-cleanup
        with:
          names-file: arc_delete_names.txt

      - run: terraform destroy -auto-approve -lock-timeout=10m

      # The symmetric gap. An apply is followed by three checks - the inventory
      # against state, the guests answering, and a plan that must come back
      # empty. A destroy was followed by nothing, so "it worked" meant "the
      # command exited zero".
      #
      # That is the same shape as OPS-004 (#176), where a guest ran for days
      # without its first-boot script because nothing asked. Here the thing
      # nobody asks is whether the destroy left anything behind - which is the
      # orphan case docs/incident-orphan-vm.md exists for, and which a
      # half-completed destroy produces exactly.
      #
      # Fails rather than warns. Unlike an Arc machine that may still be
      # onboarding, a resource left in state after a destroy is not ambiguous:
      # the destroy either removed it or did not.
      - name: The destroy left nothing behind
        shell: bash
        run: |
          set -euo pipefail

          terraform state list > post-destroy-state.txt 2>/dev/null || : > post-destroy-state.txt

          # A clean destroy empties state entirely - terraform_data is a
          # managed resource and goes with the rest. The check narrows to the
          # Proxmox resources anyway, for two reasons: they are the ones whose
          # absence from state while present on the node is the orphan case,
          # and a marker resource added later should not fail a destroy that
          # actually worked.
          LEFT=$(grep -cE '^proxmox_virtual_environment_(vm|file)\.' post-destroy-state.txt || true)

          if [ "$LEFT" -ne 0 ]; then
            echo "::error::$LEFT Proxmox resource(s) are still in state after the"
            echo "::error::destroy. A partially completed destroy is the orphan"
            echo "::error::case - see docs/incident-orphan-vm.md before re-running."
            grep -E '^proxmox_virtual_environment_' post-destroy-state.txt || true
            exit 1
          fi

          echo "No Proxmox resources remain in state."
          if [ -s post-destroy-state.txt ]; then
            echo "Still in state:"
            cat post-destroy-state.txt
          else
            echo "State is empty."
          fi

          # What this cannot see, said rather than implied: state is the
          # record, not the node. A VM the destroy failed to remove *and*
          # dropped from state would pass here, and that is precisely the
          # orphan. Confirming the node needs the runbook.
          echo "::notice::This checks state, not the hypervisor. If a destroy"
          echo "::notice::failed midway, compare against qm list - see"
          echo "::notice::docs/incident-orphan-vm.md."

      - name: Remove working files from the runner workspace
        if: always()
        shell: bash
        run: rm -f state.json arc_delete_names.txt post-destroy-state.txt
